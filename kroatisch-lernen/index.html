<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hrvatski – Kroatisch lernen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%87%AD%F0%9F%87%B7</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      Hrvatski
    </div>
    <div class="stats">
      <div class="stat streak">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C9 6 6.5 9.2 6.5 13a5.5 5.5 0 0 0 11 0c0-2-1-3.8-2-5 .3 2-.8 3-2 3-1.3 0-2-1-1.3-2.3C13.2 6.7 12 4 12 2Z"/></svg>
        <span id="streak-count">0</span>
      </div>
      <div class="stat xp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="currentColor" fill-opacity="0.15" stroke="none"/><circle cx="12" cy="12" r="8.2"/><path d="M9 15c.5.8 1.6 1.3 3 1.3s2.7-.6 2.7-1.6c0-2.4-5.4-1-5.4-3.4 0-1 1.1-1.6 2.7-1.6 1.2 0 2.1.4 2.7 1" stroke-linecap="round"/><path d="M12 7.5v9" stroke-linecap="round"/></svg>
        <span id="xp-count">0</span>
      </div>
    </div>
  </div>

  <div id="path-screen"></div>

  <div id="lesson-screen" class="hidden">
    <div class="lesson-header">
      <button class="close-btn" id="close-lesson-btn">✕</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="hearts" id="hearts"></div>
    </div>
    <div class="exercise-area" id="exercise-area"></div>
    <div class="footer-bar" id="footer-bar">
      <div class="feedback-text" id="feedback-text"></div>
      <button class="big-btn" id="check-btn" disabled>Prüfen</button>
    </div>
  </div>

  <div id="summary-screen" class="center-screen hidden">
    <div class="emoji">🎉</div>
    <h1>Lektion abgeschlossen!</h1>
    <div class="summary-stats">
      <div class="summary-stat">
        <div class="value" id="summary-xp">+0</div>
        <div class="label">XP</div>
      </div>
      <div class="summary-stat">
        <div class="value" id="summary-accuracy">0%</div>
        <div class="label">Genauigkeit</div>
      </div>
      <div class="summary-stat">
        <div class="value" id="summary-streak">0</div>
        <div class="label">Serie</div>
      </div>
    </div>
    <button class="big-btn primary" id="summary-continue-btn">Weiter</button>
  </div>

  <div id="fail-screen" class="center-screen hidden">
    <div class="emoji">💔</div>
    <h1>Keine Herzen mehr!</h1>
    <p>Versuch die Lektion noch einmal – du schaffst das.</p>
    <div style="display:flex; gap:1rem; margin-top:1rem;">
      <button class="big-btn" id="fail-back-btn">Zum Pfad</button>
      <button class="big-btn primary" id="fail-retry-btn">Erneut versuchen</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
